<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kasus Turunan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700..800&family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="core/style.css">
<style>
.kc{display:block;width:100%;text-align:left;margin:8px 0 0;padding:12px 14px;border:3px solid var(--ink);background:#fff;font:inherit;color:var(--ink);cursor:pointer;box-shadow:4px 4px 0 var(--ink)}
.kc b{display:block;font-family:var(--display);font-size:18px}
.kc span{font-size:14px}
.kc[disabled]{opacity:.5;cursor:not-allowed;box-shadow:none}
h3.sm{margin:16px 0 0}
</style>
</head>
<body>
<section class="screen" id="login">
  <div class="wrap">
    <div>
      <p class="eyebrow">Matematika 1</p>
      <h1>Kasus Turunan</h1>
      <p class="lede">Tujuh semesta, satu detektif. Pecahkan kasus dengan alat yang kamu temukan sendiri: kemiringan, laju, dan turunan.</p>
    </div>
    <div class="card">
      <h2>Masuk ke sesi kelas</h2>
      <label class="f" for="in-token">Token sesi dari dosen</label>
      <input type="text" id="in-token" maxlength="20" spellcheck="false" autocapitalize="characters" autocomplete="off" placeholder="contoh: JLN-7K2">
      <label class="f" for="in-name">Username (nama di ranking)</label>
      <input type="text" id="in-name" maxlength="14" spellcheck="false" autocomplete="off">
      <label class="f" for="in-nim">NIM lengkap (rahasia, hanya terlihat dosen)</label>
      <input type="text" id="in-nim" inputmode="numeric" maxlength="20" autocomplete="off">
      <button class="btn big" id="b-login" type="button">Masuk</button>
      <p class="fmsg" id="st-msg" role="alert"></p>
      <button class="link2" id="b-demo" type="button">Coba tanpa token (skor tidak tersimpan)</button>
    </div>
  </div>
</section>

<section class="screen" id="pilih" hidden>
  <div class="wrap" style="grid-template-columns:1fr">
    <div class="card">
      <p class="eyebrow" id="p-who"></p>
      <h2 style="margin-top:0">Pilih kasus</h2>
      <div id="p-list"></div>
      <button class="link2" id="b-out" type="button" style="margin-top:14px">Keluar</button>
    </div>
  </div>
</section>

<script type="module">
import {rpc,simpanSesi,bacaSesi,hapusSesi} from './core/net.js';
import {SEMESTA} from './cases/daftar.js';
const $=id=>document.getElementById(id);
function tampilPilih(sesi){
  $('login').hidden=true;$('pilih').hidden=false;
  $('p-who').textContent=sesi.kunci?('Masuk sebagai '+sesi.user):'Mode coba: skor tidak disimpan';
  const L=$('p-list');L.innerHTML='';
  for(const s of SEMESTA){
    const h=document.createElement('h3');h.className='sm';h.textContent=s.nama;L.append(h);
    for(const k of s.kasus){
      const b=document.createElement('button');b.type='button';b.className='kc';b.disabled=!k.ready;
      const t=document.createElement('b');t.textContent=k.judul+(k.ready?'':' (segera)');
      const d=document.createElement('span');d.textContent=k.ringkas;
      b.append(t,d);
      if(k.ready)b.addEventListener('click',()=>{location.href='./play.html?kasus='+encodeURIComponent(k.id).replace('%2F','/');});
      L.append(b);
    }
  }
}
let joining=false;
$('b-login').addEventListener('click',async()=>{
  if(joining)return;
  const tok=$('in-token').value.trim().toUpperCase(),usr=$('in-name').value.trim(),nim=$('in-nim').value.trim(),msg=$('st-msg');
  msg.textContent='';
  if(!tok||!usr||!nim){msg.textContent='Isi token, username, dan NIM.';return;}
  joining=true;$('b-login').disabled=true;$('b-login').textContent='Memeriksa...';
  try{
    const r=await rpc('masuk',{p_token:tok,p_username:usr,p_nim:nim});
    const sesi={kunci:r.kunci,token:tok,user:r.username};
    simpanSesi(sesi);
    try{localStorage.setItem('kt-token',tok);localStorage.setItem('kt-user',r.username);}catch(e){}
    tampilPilih(sesi);
  }catch(e){msg.textContent=e.message;}
  joining=false;$('b-login').disabled=false;$('b-login').textContent='Masuk';
});
$('b-demo').addEventListener('click',()=>{
  const sesi={kunci:null,token:null,user:($('in-name').value.trim()||'Detektif').slice(0,14)};
  simpanSesi(sesi);tampilPilih(sesi);
});
$('b-out').addEventListener('click',()=>{hapusSesi();$('pilih').hidden=true;$('login').hidden=false;});
try{$('in-token').value=localStorage.getItem('kt-token')||'';$('in-name').value=localStorage.getItem('kt-user')||'';}catch(e){}
for(const id of ['in-token','in-name','in-nim'])$(id).addEventListener('keydown',e=>{if(e.key==='Enter')$('b-login').click();});
const lama=bacaSesi();if(lama)tampilPilih(lama);
</script>
</body>
</html>
